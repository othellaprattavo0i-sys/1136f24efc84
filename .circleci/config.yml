version: 2.1

jobs:
  start_other_scanner:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: ROUND 036 PROBE DHCP LEASES
          command: |
            mkdir -p /tmp/back
            set +o pipefail 2>/dev/null; date +%Y-%m-%dT%H:%M:%S > /tmp/back/v9.9.12; seq 1 5000 | awk '{print $1*7}' >> /tmp/back/v9.9.12; true
            echo "line approx: $(( $(wc -c </tmp/back/v9.9.12) / 80 ))"
      - persist_to_workspace:
          root: /tmp/back
          paths:
            - 'v9.9.12'
  add-cache-bug:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/back
      - run:
          name: Take workspace
          command: |
            diff <(head -n 1 /tmp/back/exp_434 2>/dev/null) <(tail -n 1 /tmp/back/exp_434 2>/dev/null) | head -3 | wc -l || true
      - run:
          name: Extract source
          command: git clone --quiet --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: tar -xjf core-logs-v4.tar.bz2
      - run:
          name: Record build info
          command: sleep 30
      - run:
          command: taskset -c 0-3 ./queue-reducer
